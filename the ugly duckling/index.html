<!DOCTYPE html>
<html>
    <head>
        <title>DRAW SOMETHING BADLY</title>

        <style>

body{
  text-align:center;
  font-family: "Comic Sans MS", "Arial";
  background: linear-gradient(135deg,#ffd6e7,#d6f0ff);
  padding-top:40px;
}

h1{
  color:#ff4fa3;
  font-size:40px;
}

#timer{
  font-size:20px;
  color:#555;
}

canvas{
  border:4px solid #ffb3d9;
  border-radius:20px;
  background:white;
  box-shadow:0px 6px 15px rgba(0,0,0,0.15);
  cursor:crosshair;
}

button{
  margin-top:15px;
  padding:10px 20px;
  font-size:16px;
  border:none;
  border-radius:12px;
  background:#ff8ecf;
  color:white;
  cursor:pointer;
  box-shadow:0px 4px 10px rgba(0,0,0,0.15);
}

button:hover{
  background:#ff6db8;
  transform:scale(1.05);
}

</style>
    </head>
    <body>
        <h1>Draw something badly
🐤</h1>
        <p id="timer">Time left</p>
        <canvas id="canvas" width="400" height="300"></canvas>

        <br><br>

        <button onclick="clearCanvas()">Clear</button>

        <script src="script.js"></script>

    </body>
</html>
